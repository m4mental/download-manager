name: Android CI/CD Release Pipeline

on:
  push:
    branches: [ main, dev, alpha ]
  pull_request:
    branches: [ main, dev, alpha ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check_signing.outputs.should_publish }}
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
      prerelease: ${{ steps.release_info.outputs.prerelease }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Check Signing Secrets Availability
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Signing secrets detected."
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Signing secrets missing. Will build without publishing."
          fi

      - name: Setup Keystore
        if: steps.check_signing.outputs.should_publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/speeddown-release.jks

      - name: Build Release APK
        if: steps.check_signing.outputs.should_publish == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK (Validation when not publishing)
        if: steps.check_signing.outputs.should_publish != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Determine Release Tag and Channel
        if: steps.check_signing.outputs.should_publish == 'true' && github.event_name != 'pull_request'
        id: release_info
        run: |
          REF_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_NUM="${{ github.run_number }}"
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0"; fi
          
          if [ "$REF_NAME" = "main" ]; then
            TAG_NAME="v${VERSION_NAME}.${RUN_NUM}"
            RELEASE_NAME="SpeedDown Release v${VERSION_NAME}.${RUN_NUM}"
            PRERELEASE=false
          elif [ "$REF_NAME" = "dev" ]; then
            TAG_NAME="v${VERSION_NAME}-beta.${RUN_NUM}"
            RELEASE_NAME="SpeedDown Beta v${VERSION_NAME}-beta.${RUN_NUM}"
            PRERELEASE=true
          else
            TAG_NAME="v${VERSION_NAME}-alpha.${RUN_NUM}"
            RELEASE_NAME="SpeedDown Alpha v${VERSION_NAME}-alpha.${RUN_NUM}"
            PRERELEASE=true
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Organize Architecture Release APKs
        if: steps.check_signing.outputs.should_publish == 'true' && github.event_name != 'pull_request'
        run: |
          mkdir -p release-apks
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              filename="$(basename "$f")"
              clean_name="$(echo "$filename" | sed 's/^app-/SpeedDown-/')"
              cp "$f" "release-apks/$clean_name"
              echo "Prepared: $clean_name"
            fi
          done
          ls -lh release-apks

      - name: Generate Changelog and Architecture Guide
        if: steps.check_signing.outputs.should_publish == 'true' && github.event_name != 'pull_request'
        run: |
          echo "### 🚀 SpeedDown Release Notes" > changelog.md
          echo "" >> changelog.md
          echo "Commit: \`${{ github.sha }}\`" >> changelog.md
          echo "" >> changelog.md
          echo "### 📱 Which APK should you download? (Architecture Guide)" >> changelog.md
          echo "| File Name | CPU Architecture | Compatible Devices | Size |" >> changelog.md
          echo "| :--- | :--- | :--- | :--- |" >> changelog.md
          echo "| **\`SpeedDown-arm64-v8a-release.apk\`** | **arm64-v8a** (64-bit ARM) | **90%+ Modern Android Phones** (Snapdragon, MediaTek, Tensor, Exynos) | **~82 MB** (Recommended) |" >> changelog.md
          echo "| **\`SpeedDown-armeabi-v7a-release.apk\`** | **armeabi-v7a** (32-bit ARM) | Older 32-bit Android Phones | **~79 MB** |" >> changelog.md
          echo "| **\`SpeedDown-x86_64-release.apk\`** | **x86_64** (Intel / AMD 64-bit) | PC Emulators & ChromeOS | **~86 MB** |" >> changelog.md
          echo "| **\`SpeedDown-universal-release.apk\`** | **Universal All-in-One** | Works on Any Android Device | **~208 MB** |" >> changelog.md
          echo "" >> changelog.md
          echo "> 💡 **Tip:** Agar aap normal modern smartphone use kar rahe hain to **\`SpeedDown-arm64-v8a-release.apk\`** download karein." >> changelog.md
          echo "" >> changelog.md
          echo "#### Recent Changes:" >> changelog.md
          git log -1 --pretty=format:"%s%n%n%b" >> changelog.md

      - name: Upload Release Artifacts
        if: steps.check_signing.outputs.should_publish == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            release-apks/*.apk
            changelog.md

  publish:
    name: Publish Release
    needs: build
    if: needs.build.outputs.should_publish == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-bundle

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.release_name }}
          body_path: release-bundle/changelog.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            release-bundle/release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
