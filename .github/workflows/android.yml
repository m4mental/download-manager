name: Android CI/CD Release Pipeline

on:
  push:
    branches: [ main, dev, alpha ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/speeddown-release.jks
          fi
          # Fallback: if keystore is missing or 0-byte, generate a valid 2048-bit release key automatically
          if [ ! -s keystore/speeddown-release.jks ]; then
            echo "Generating automated release signing key..."
            keytool -genkeypair -v \
              -keystore keystore/speeddown-release.jks \
              -alias speeddown \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass speeddown123 \
              -keypass speeddown123 \
              -dname "CN=SpeedDown, OU=Mobile, O=SpeedDown, L=San Francisco, S=CA, C=US"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'speeddown123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'speeddown' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'speeddown123' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Release Tag and Channel
        id: release_info
        run: |
          REF_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          
          if [ "$REF_NAME" = "main" ]; then
            TAG_NAME="v1.0-${DATE}-${SHORT_SHA}"
            RELEASE_NAME="SpeedDown Official Release ${TAG_NAME}"
            PRERELEASE=false
          elif [ "$REF_NAME" = "dev" ]; then
            TAG_NAME="beta-${DATE}-${SHORT_SHA}"
            RELEASE_NAME="SpeedDown Beta Build ${TAG_NAME}"
            PRERELEASE=true
          else
            TAG_NAME="alpha-${DATE}-${SHORT_SHA}"
            RELEASE_NAME="SpeedDown Alpha Preview ${TAG_NAME}"
            PRERELEASE=true
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          echo "### 🚀 SpeedDown Release Notes" > changelog.md
          echo "" >> changelog.md
          echo "Commit: \`${{ github.sha }}\`" >> changelog.md
          echo "" >> changelog.md
          echo "#### Recent Changes:" >> changelog.md
          git log -1 --pretty=format:"%s%n%n%b" >> changelog.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: changelog.md
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
